[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Let Dockerfile CMD handle the start command to ensure proper PORT expansion
# startCommand is commented out to use Dockerfile CMD instead
# Use root path for health checks - Railway checks this automatically
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

